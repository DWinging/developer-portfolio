
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portfolio</title>
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="./vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="./viewer.css?v=5">
</head>
<body>
  <a class="download-button" href="./최동욱_portfolio.pdf" download="최동욱_portfolio.pdf">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5" />
    </svg>
    PDF 다운로드
  </a>
  <p id="status" role="status" aria-live="polite">포트폴리오를 불러오는 중입니다…</p>
  <div id="viewerContainer" role="main" tabindex="0" aria-label="포트폴리오 PDF" aria-busy="true">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <noscript>포트폴리오를 보려면 브라우저에서 JavaScript를 활성화해 주세요.</noscript>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('status').textContent =
        '로컬에서는 start-local.cmd를 실행한 뒤 http://localhost:8000으로 접속해 주세요.';
      document.getElementById('viewerContainer').setAttribute('aria-busy', 'false');
    } else import('./viewer.mjs?v=5').catch(error => {
      console.error(error);
      const status = document.getElementById('status');
      status.hidden = false;
      status.textContent = '포트폴리오를 불러오지 못했습니다. 페이지를 새로고침해 주세요.';
      document.getElementById('viewerContainer').setAttribute('aria-busy', 'false');
    });
  </script>
</body>
</html>
